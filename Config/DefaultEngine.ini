; 101st Floor - engine configuration (versioned source of truth for rendering settings).
; Rationale and verification for every rendering setting: docs/rendering-rtx.md

[/Script/EngineSettings.GameMapsSettings]
; Engine template map until MVP 0 provides a project-owned level.
EditorStartupMap=/Engine/Maps/Templates/Template_Default.Template_Default
GameDefaultMap=/Engine/Maps/Templates/Template_Default.Template_Default
; Editing session: orbit camera, visible cursor (ADR-0008).
GlobalDefaultGameMode=/Script/Floor101.Floor101GameMode

[/Script/Engine.Engine]
; Routes mouse, keys and typed lengths to the edit controller (ADR-0008).
GameViewportClientClassName=/Script/Floor101.Floor101GameViewportClient
; Close inspection: the camera can approach to 2 cm without the default 10 cm near plane hiding details.
NearClipPlane=1.0

[/Script/Engine.UserInterfaceSettings]
; Desktop panels reflow instead of shrinking their text on small windows (ADR-0026).
UIScaleCurve=(EditorCurveData=(Keys=((Time=0.000000,Value=1.000000),(Time=4320.000000,Value=1.000000))),ExternalCurve=None)

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/Engine.RendererSettings]
; Lumen global illumination and reflections (Design mode).
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.AllowStaticLighting=False
; Distance fields keep Lumen's software ray tracing path available as a fallback.
r.GenerateMeshDistanceFields=True

; Hardware ray tracing (DXR). r.RayTracing is read-only at runtime and requires skin cache shaders.
r.RayTracing=True
r.SkinCache.CompileShaders=True
r.RayTracing.RayTracingProxies.ProjectEnabled=True
; Engine default is already 1; set explicitly so the intent is versioned.
r.Lumen.HardwareRayTracing=True

; Virtual Shadow Maps.
r.Shadow.Virtual.Enable=1

; Substrate materials (UE 5.8 new-project default).
r.Substrate=True
r.Substrate.ProjectGBufferFormat=0

; UE 5.8 new-project post-processing defaults.
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
; No D3D11 shader formats on purpose: a silent DX11 fallback must be impossible.
-D3D11TargetedShaderFormats=PCD3D_SM5

[SystemSettings]
; Dynamic architectural materials have many unused PSO variants. Keep on-demand/driver caching,
; without speculative compilation that leaves the first Shipping session closing for minutes (ADR-0028).
r.PSOPrecaching=0
; Allow native HDR; the user's button/settings decide whether to enable it (ADR-0022).
r.AllowHDR=1
; UE 5.8 uses the active display's peak/gamut and Windows paper white rather than a fixed monitor profile.
r.HDR.Display.OverrideOSMaxLuminance=0
r.HDR.UI.CompositeMode=1
r.HDR.UI.Level=1.0
; Display controls promise 1:1 pixels, including the internal render before TSR (ADR-0023).
r.ScreenPercentage.Default=100
r.ScreenPercentage.Default.Desktop.Mode=0
r.SecondaryScreenPercentage.GameViewport=100
r.DynamicRes.OperationMode=0
