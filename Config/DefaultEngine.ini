; 101st Floor - engine configuration (versioned source of truth for rendering settings).
; Rationale and verification for every rendering setting: docs/rendering-rtx.md

[/Script/EngineSettings.GameMapsSettings]
; Engine template map until MVP 0 provides a project-owned level.
EditorStartupMap=/Engine/Maps/Templates/Template_Default.Template_Default
GameDefaultMap=/Engine/Maps/Templates/Template_Default.Template_Default

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/Engine.RendererSettings]
; Lumen global illumination and reflections (Design mode).
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.AllowStaticLighting=False
; Distance fields keep Lumen's software ray tracing path available as a fallback.
r.GenerateMeshDistanceFields=True

; Hardware ray tracing (DXR). r.RayTracing is read-only at runtime and requires skin cache shaders.
r.RayTracing=True
r.SkinCache.CompileShaders=True
r.RayTracing.RayTracingProxies.ProjectEnabled=True
; Engine default is already 1; set explicitly so the intent is versioned.
r.Lumen.HardwareRayTracing=True

; Virtual Shadow Maps.
r.Shadow.Virtual.Enable=1

; Substrate materials (UE 5.8 new-project default).
r.Substrate=True
r.Substrate.ProjectGBufferFormat=0

; UE 5.8 new-project post-processing defaults.
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
; No D3D11 shader formats on purpose: a silent DX11 fallback must be impossible.
-D3D11TargetedShaderFormats=PCD3D_SM5
